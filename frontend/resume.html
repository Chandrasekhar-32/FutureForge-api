<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Analyzer — FutureForge AI</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container layout-with-sidebar">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <div class="page-header">
        <h1>Resume Analyzer</h1>
        <p>ATS scoring, strengths, gaps, and AI recommendations</p>
      </div>
      <div class="card">
        <div class="form-group">
          <label>Target career (any field)</label>
          <div id="careerPickerMount"></div>
        </div>
        <div class="form-group">
          <label>Upload resume (PDF or TXT)</label>
          <input type="file" id="resumeFile" accept=".pdf,.txt" />
        </div>
        <div class="form-group">
          <label>Or paste resume text</label>
          <textarea id="resumeText" rows="8" placeholder="Paste your resume content here..."></textarea>
        </div>
        <button class="btn btn-primary" id="analyzeBtn">Analyze Resume</button>
        <div id="alert" hidden style="margin-top:16px"></div>
      </div>
      <div id="results" class="card" style="margin-top:24px;display:none">
        <h2>ATS Score: <span id="atsScore" style="color:var(--accent-2)">—</span></h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px">
          <div>
            <h3>Strengths</h3>
            <ul id="strengths" style="margin-top:8px;color:var(--success)"></ul>
          </div>
          <div>
            <h3>Missing</h3>
            <ul id="missing" style="margin-top:8px;color:var(--danger)"></ul>
          </div>
        </div>
        <h3 style="margin-top:24px">Recommendations</h3>
        <ul id="recommendations" style="margin-top:8px;color:var(--text-muted)"></ul>
      </div>
    </main>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/career-picker.js"></script>
  <script src="js/resume.js"></script>
</body>
</html>
