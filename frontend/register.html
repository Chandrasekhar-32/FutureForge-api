<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — FutureForge AI</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo" style="justify-content:center;margin-bottom:24px">
        <span class="logo-icon">⚡</span> FutureForge AI
      </a>
      <h1>Create student account</h1>
      <p class="subtitle">Save your dream career, roadmap, and progress in one place</p>
      <div id="alert" hidden></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" name="name" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@university.edu" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required minlength="6" placeholder="Min 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
