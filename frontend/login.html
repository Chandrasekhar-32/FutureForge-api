<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FutureForge AI</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo" style="justify-content:center;margin-bottom:24px">
        <span class="logo-icon">⚡</span> FutureForge AI
      </a>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your career operating system</p>
      <div id="alert" hidden></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@university.edu" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <div class="auth-divider">or</div>
      <button type="button" class="btn btn-google" id="googleBtn">Continue with Google (demo)</button>
      <p class="auth-footer">No account? <a href="register.html">Register</a></p>
    </div>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
